type: object
properties:
  id:
    type: integer
    format: int
    description: Identifies this copy of the effect. A user can hold several copies of the same effect.
  effectId:
    type: integer
    format: int
    description: Identifies the effect in the catalogue.
  name:
    $ref: "./Name.yaml"
  description:
    type: string
  useCount:
    type: integer
    format: int
    nullable: true
    x-omitempty: true
    description: How many times the effect can be used, left out for no limit.
  usesLeft:
    type: integer
    format: int
    nullable: true
    x-omitempty: true
    description: How many uses are left, left out for an effect without a limit.
  duration:
    $ref: "./Duration.yaml"
  startedDate:
    type: string
    format: date-time
  modifiers:
    type: array
    items:
      $ref: "./PointModifier.yaml"
  entries:
    $ref: "./NamedChangeEntries.yaml"
required: [ id, effectId, name, description, startedDate, modifiers, entries ]