type: object
properties:
  name:
    $ref: "./Name.yaml"
  description:
    type: string
  useCount:
    type: integer
    format: int
    nullable: true
    description: How many times the effect can be used, or null for no limit.
  usesLeft:
    type: integer
    format: int
    nullable: true
    description: How many uses are left, or null for an effect without a limit.
  duration:
    $ref: "./Duration.yaml"
  startedDate:
    type: string
    format: date-time
  modifiers:
    type: array
    items:
      $ref: "./PointModifier.yaml"
  entries:
    $ref: "./NamedChangeEntries.yaml"
required: [ name, description, useCount, usesLeft, startedDate, modifiers, entries ]