type: object
properties:
  name:
    $ref: "./Name.yaml"
  action:
    type: string
  endState:
    type: string
    enum: [ "started", "finished", "cancelled" ]
  timeSpent:
    $ref: "./Duration.yaml"
  createdDate:
    type: string
    format: date-time
required: [ name, action, timeSpent, createdDate ]