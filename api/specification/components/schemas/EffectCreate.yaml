type: object
description: >
  Creates an effect. durationInSeconds is left out for an effect that does not run out on its own.
properties:
  name:
    $ref: "./Name.yaml"
  description:
    type: string
  useCount:
    type: integer
    format: int
    nullable: true
    default: null
    description: How many times the effect can be used, or null for no limit.
  durationInSeconds:
    type: integer
    format: int
  entries:
    $ref: "./ChangeEntryInputs.yaml"
required: [ name, description, entries ]