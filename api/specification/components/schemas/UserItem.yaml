type: object
properties:
  id:
    type: integer
    format: int
    description: Identifies this copy of the item. A user can hold several copies of the same item.
  itemId:
    type: integer
    format: int
    description: Identifies the item in the catalogue.
  name:
    $ref: "./Name.yaml"
  description:
    type: string
  usesLeft:
    type: integer
    format: int
  receivedDate:
    type: string
    format: date-time
  entries:
    $ref: "./NamedChangeEntries.yaml"
required: [ id, itemId, name, description, usesLeft, receivedDate, entries ]