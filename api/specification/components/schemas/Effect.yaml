type: object
properties:
  name:
    $ref: "./Name.yaml"
  description:
    type: string
  useCount:
    type: integer
    format: int
    nullable: true
    x-omitempty: true
    description: How many times the effect can be used, left out for no limit.
  duration:
    $ref: "./Duration.yaml"
  modifiers:
    type: array
    items:
      $ref: "./PointModifier.yaml"
  entries:
    $ref: "./NamedChangeEntries.yaml"
required: [ name, description, modifiers, entries ]