type: object
properties:
  description:
    type: string
  isPublic:
    type: boolean
  isShared:
    type: boolean
  minimum:
    type: integer
    format: int
    nullable: true
    default: 0
    description: The lowest value a point can have, or null for no lower bound.
  maximum:
    type: integer
    format: int
    nullable: true
    default: null
    description: The highest value a point can have, or null for no upper bound.
required: [ description, isPublic, isShared, minimum, maximum ]