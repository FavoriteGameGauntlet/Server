type: object
properties:
  name:
    $ref: "./Name.yaml"
  description:
    type: string
  startValue:
    type: integer
    format: int
    description: The value of a point not held yet. Points already held keep their value.
  isPublic:
    type: boolean
  isShared:
    type: boolean
  minimum:
    type: integer
    format: int
    nullable: true
    default: 0
    description: The lowest value a point can have, or null for no lower bound.
  maximum:
    type: integer
    format: int
    nullable: true
    default: null
    description: The highest value a point can have, or null for no upper bound.
required: [ name, description, startValue, isPublic, isShared, minimum, maximum ]
