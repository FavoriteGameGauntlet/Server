type: object
properties:
  effectId:
    type: integer
    format: int
    description: Identifies the effect in the catalogue.
  userEffectId:
    type: integer
    format: int
    description: Identifies the copy of the effect the entry is about. The copy may be gone by now.
  name:
    $ref: "./Name.yaml"
  description:
    type: string
  action:
    type: string
  actorLogin:
    $ref: "./Login.yaml"
  useCount:
    type: integer
    format: int
    nullable: true
    x-omitempty: true
  usesLeft:
    type: integer
    format: int
    nullable: true
    x-omitempty: true
  createdDate:
    type: string
    format: date-time
  entries:
    $ref: "./NamedChangeEntries.yaml"
required: [ effectId, userEffectId, name, description, action, actorLogin, createdDate, entries ]
