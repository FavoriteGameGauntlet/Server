type: object
properties:
  itemId:
    type: integer
    format: int
    description: Identifies the item in the catalogue.
  userItemId:
    type: integer
    format: int
    description: Identifies the copy of the item the entry is about. The copy may be gone by now.
  name:
    $ref: "./Name.yaml"
  action:
    type: string
  actorLogin:
    $ref: "./Login.yaml"
  useCount:
    type: integer
    format: int
  usesLeft:
    type: integer
    format: int
    nullable: true
    x-omitempty: true
  createdDate:
    type: string
    format: date-time
required: [ itemId, userItemId, name, action, actorLogin, useCount, createdDate ]
