openapi: 3.0.4
info:
  title: Favorite Game Gauntlet
  version: 0.1.0
paths:
  /exchanges/catalog:
    get:
      operationId: getExchanges
      tags:
        - Exchanges
      responses:
        '200':
          $ref: '#/components/responses/ExchangesResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
    post:
      operationId: createExchange
      tags:
        - Exchanges
      requestBody:
        $ref: '#/components/requestBodies/ExchangeCreateRequest'
      responses:
        '200':
          $ref: '#/components/responses/ExchangeResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '422':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
  /exchanges/catalog/removed:
    get:
      operationId: getRemovedExchanges
      tags:
        - Exchanges
      responses:
        '200':
          $ref: '#/components/responses/ExchangesResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
  /exchanges/catalog/{name}:
    delete:
      operationId: removeExchange
      tags:
        - Exchanges
      parameters:
        - $ref: '#/components/parameters/Name'
      responses:
        '204':
          description: Success.
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
  /exchanges/catalog/{name}/use:
    post:
      operationId: useExchange
      tags:
        - Exchanges
      parameters:
        - $ref: '#/components/parameters/Name'
      requestBody:
        $ref: '#/components/requestBodies/ExchangeUseRequest'
      responses:
        '204':
          description: Success.
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
  /exchanges/{login}/history:
    get:
      operationId: getUserExchangeHistory
      tags:
        - Exchanges
      parameters:
        - $ref: '#/components/parameters/Login'
      responses:
        '200':
          $ref: '#/components/responses/ExchangeHistoriesResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
components:
  schemas:
    Name:
      type: string
      pattern: ^.+$
      minLength: 1
      maxLength: 70
    Exchange:
      type: object
      properties:
        name:
          $ref: '#/components/schemas/Name'
        description:
          type: string
      required:
        - name
        - description
    Exchanges:
      type: array
      items:
        $ref: '#/components/schemas/Exchange'
    Error:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
      required:
        - code
        - message
    ChangeEntryInput:
      type: object
      description: |
        Names one thing a change grants. Exactly one of pointTypeName, itemName, perkName or effectName has to be set. The amount carries the sign it is applied with, so a cost is negative.
      properties:
        pointTypeName:
          $ref: '#/components/schemas/Name'
        itemName:
          $ref: '#/components/schemas/Name'
        perkName:
          $ref: '#/components/schemas/Name'
        effectName:
          $ref: '#/components/schemas/Name'
        amount:
          type: integer
          format: int
      required:
        - amount
    ChangeEntryInputs:
      type: array
      items:
        $ref: '#/components/schemas/ChangeEntryInput'
    ExchangeCreate:
      type: object
      description: |
        Creates an exchange. sourceEntries are what it costs and targetEntries are what it gives. Both carry the sign they are applied with, so a cost is negative.
      properties:
        name:
          $ref: '#/components/schemas/Name'
        description:
          type: string
        sourceEntries:
          $ref: '#/components/schemas/ChangeEntryInputs'
        targetEntries:
          $ref: '#/components/schemas/ChangeEntryInputs'
      required:
        - name
        - description
        - sourceEntries
        - targetEntries
    Login:
      type: string
      pattern: ^\w+$
      minLength: 3
      maxLength: 35
    ExchangeUse:
      type: object
      description: |
        Uses an exchange. Without targetLogins both sides of the exchange fall on the user making it. With them, the source change is what the named users lose and the target change is what the user making the exchange gains, which is how a mechanic that takes something from another player is expressed.
      properties:
        targetLogins:
          type: array
          items:
            $ref: '#/components/schemas/Login'
    ExchangeHistoryEntry:
      type: object
      properties:
        name:
          $ref: '#/components/schemas/Name'
        description:
          type: string
        usedDate:
          type: string
          format: date-time
      required:
        - name
        - description
        - usedDate
    ExchangeHistoryEntries:
      type: array
      items:
        $ref: '#/components/schemas/ExchangeHistoryEntry'
  responses:
    ExchangesResponse:
      description: Success.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Exchanges'
    ErrorResponse:
      description: Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ExchangeResponse:
      description: Success.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Exchange'
    ExchangeHistoriesResponse:
      description: Success.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ExchangeHistoryEntries'
  requestBodies:
    ExchangeCreateRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ExchangeCreate'
    ExchangeUseRequest:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ExchangeUse'
  parameters:
    Name:
      name: name
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Name'
    Login:
      name: login
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Login'
