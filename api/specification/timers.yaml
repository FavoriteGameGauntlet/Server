openapi: 3.0.4
info:
  title: Favorite Game Gauntlet
  version: 0.12.5
paths:
  /parties/{partyId}/timers/current:
    get:
      operationId: getCurrentTimer
      tags:
        - Timers
      parameters:
        - $ref: '#/components/parameters/PartyId'
      responses:
        '200':
          $ref: '#/components/responses/TimerResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
    post:
      operationId: createCurrentTimer
      tags:
        - Timers
      parameters:
        - $ref: '#/components/parameters/PartyId'
      responses:
        '201':
          $ref: '#/components/responses/TimerResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
  /parties/{partyId}/timers/current/start:
    post:
      operationId: startCurrentTimer
      tags:
        - Timers
      parameters:
        - $ref: '#/components/parameters/PartyId'
      responses:
        '200':
          $ref: '#/components/responses/TimerResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
  /parties/{partyId}/timers/current/pause:
    post:
      operationId: pauseCurrentTimer
      tags:
        - Timers
      parameters:
        - $ref: '#/components/parameters/PartyId'
      responses:
        '200':
          $ref: '#/components/responses/TimerResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
  /parties/{partyId}/timers/reward:
    get:
      operationId: getTimerReward
      tags:
        - Timers
      parameters:
        - $ref: '#/components/parameters/PartyId'
      responses:
        '200':
          $ref: '#/components/responses/TimerRewardResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
    put:
      operationId: setTimerReward
      tags:
        - Timers
      parameters:
        - $ref: '#/components/parameters/PartyId'
      requestBody:
        $ref: '#/components/requestBodies/TimerRewardRequest'
      responses:
        '201':
          $ref: '#/components/responses/TimerRewardResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '422':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
    delete:
      operationId: removeTimerReward
      tags:
        - Timers
      parameters:
        - $ref: '#/components/parameters/PartyId'
      responses:
        '204':
          description: Success.
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
components:
  parameters:
    PartyId:
      name: partyId
      in: path
      required: true
      schema:
        type: integer
        format: int
  schemas:
    Duration:
      type: string
      format: duration
      example: PT2h10m5s
      description: The duration notation as defined by ISO 8601
    Timer:
      type: object
      properties:
        state:
          type: string
          enum:
            - created
            - running
            - paused
            - finished
        remainingTime:
          $ref: '#/components/schemas/Duration'
        duration:
          $ref: '#/components/schemas/Duration'
        lastActionDate:
          type: string
          format: date-time
      required:
        - state
        - remainingTime
        - duration
        - lastActionDate
    Error:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
      required:
        - code
        - message
    Name:
      type: string
      pattern: ^.+$
      minLength: 1
      maxLength: 70
    NullableName:
      allOf:
        - $ref: '#/components/schemas/Name'
      nullable: true
      default: null
      x-omitempty: true
    NamedChangeEntry:
      type: object
      description: |
        Names one thing a change grants. Exactly one of pointTypeName, itemId, perkName or effectId has to be set. The amount carries the sign it is applied with, so a cost is negative.
      properties:
        pointTypeName:
          $ref: '#/components/schemas/NullableName'
        itemId:
          type: integer
          format: int
          nullable: true
          default: null
          x-omitempty: true
        perkName:
          $ref: '#/components/schemas/NullableName'
        effectId:
          type: integer
          format: int
          nullable: true
          default: null
          x-omitempty: true
        amount:
          type: integer
          format: int
      required:
        - amount
    NamedChangeEntries:
      type: array
      items:
        $ref: '#/components/schemas/NamedChangeEntry'
    TimerReward:
      type: object
      description: |
        What the party grants for every completed timer. Without a reward set, entries is empty.
      properties:
        entries:
          $ref: '#/components/schemas/NamedChangeEntries'
      required:
        - entries
  responses:
    TimerResponse:
      description: Success.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Timer'
    ErrorResponse:
      description: Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TimerRewardResponse:
      description: Success.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TimerReward'
  requestBodies:
    TimerRewardRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TimerReward'
