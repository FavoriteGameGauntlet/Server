openapi: 3.0.4
info:
  title: Favorite Game Gauntlet
  version: 0.15.0
paths:
  /points/types:
    get:
      operationId: getPointTypes
      tags:
        - Points
      responses:
        '200':
          $ref: '#/components/responses/PointTypesResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
    post:
      operationId: createPointType
      tags:
        - Points
      requestBody:
        $ref: '#/components/requestBodies/PointTypeCreateRequest'
      responses:
        '200':
          $ref: '#/components/responses/PointTypeResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/ErrorResponse'
        '422':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
  /points/types/{name}:
    patch:
      operationId: changePointType
      tags:
        - Points
      parameters:
        - $ref: '#/components/parameters/Name'
      requestBody:
        $ref: '#/components/requestBodies/PointTypeChangeRequest'
      responses:
        '204':
          description: Success.
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '422':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
    delete:
      operationId: removePointType
      tags:
        - Points
      parameters:
        - $ref: '#/components/parameters/Name'
      responses:
        '204':
          description: Success.
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
  /points/all:
    get:
      operationId: getAllUserPoints
      tags:
        - Points
      responses:
        '200':
          $ref: '#/components/responses/UserPointsByLoginsResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
  /points/party/{name}:
    get:
      operationId: getPartyPointValue
      tags:
        - Points
      parameters:
        - $ref: '#/components/parameters/Name'
      responses:
        '200':
          $ref: '#/components/responses/PointsResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
    post:
      operationId: changePartyPointValue
      tags:
        - Points
      parameters:
        - $ref: '#/components/parameters/Name'
      requestBody:
        $ref: '#/components/requestBodies/PointChangeRequest'
      responses:
        '200':
          $ref: '#/components/responses/PointChangeResultResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '422':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
  /points/party/{name}/history:
    get:
      operationId: getPartyPointHistory
      tags:
        - Points
      parameters:
        - $ref: '#/components/parameters/Name'
      responses:
        '200':
          $ref: '#/components/responses/PointHistoriesResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
  /points/{login}:
    get:
      operationId: getUserPoints
      tags:
        - Points
      parameters:
        - $ref: '#/components/parameters/Login'
      responses:
        '200':
          $ref: '#/components/responses/UserPointsResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
  /points/{login}/{name}:
    get:
      operationId: getUserPointValue
      tags:
        - Points
      parameters:
        - $ref: '#/components/parameters/Login'
        - $ref: '#/components/parameters/Name'
      responses:
        '200':
          $ref: '#/components/responses/PointsResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
    post:
      operationId: changeUserPointValue
      tags:
        - Points
      parameters:
        - $ref: '#/components/parameters/Login'
        - $ref: '#/components/parameters/Name'
      requestBody:
        $ref: '#/components/requestBodies/PointChangeRequest'
      responses:
        '200':
          $ref: '#/components/responses/PointChangeResultResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '422':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
  /points/{login}/{name}/history:
    get:
      operationId: getUserPointHistory
      tags:
        - Points
      parameters:
        - $ref: '#/components/parameters/Login'
        - $ref: '#/components/parameters/Name'
      responses:
        '200':
          $ref: '#/components/responses/PointHistoriesResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
components:
  schemas:
    Name:
      type: string
      pattern: ^.+$
      minLength: 1
      maxLength: 70
    PointType:
      type: object
      properties:
        name:
          $ref: '#/components/schemas/Name'
        description:
          type: string
        startValue:
          type: integer
          format: int
        isPublic:
          type: boolean
        isShared:
          type: boolean
        minimum:
          type: integer
          format: int
          nullable: true
          description: The lowest value a point can have, or null for no lower bound.
        maximum:
          type: integer
          format: int
          nullable: true
          description: The highest value a point can have, or null for no upper bound.
      required:
        - name
        - description
        - startValue
        - isPublic
        - isShared
        - minimum
        - maximum
    PointTypes:
      type: array
      items:
        $ref: '#/components/schemas/PointType'
    Error:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
      required:
        - code
        - message
    PointTypeCreate:
      type: object
      properties:
        name:
          $ref: '#/components/schemas/Name'
        description:
          type: string
        startValue:
          type: integer
          format: int
        isPublic:
          type: boolean
        isShared:
          type: boolean
          default: false
        minimum:
          type: integer
          format: int
          nullable: true
          default: 0
          description: The lowest value a point can have, or null for no lower bound.
        maximum:
          type: integer
          format: int
          nullable: true
          default: null
          description: The highest value a point can have, or null for no upper bound.
      required:
        - name
        - description
        - startValue
        - isPublic
        - isShared
        - minimum
        - maximum
    PointTypeChange:
      type: object
      properties:
        description:
          type: string
        isPublic:
          type: boolean
        isShared:
          type: boolean
        minimum:
          type: integer
          format: int
          nullable: true
          default: 0
          description: The lowest value a point can have, or null for no lower bound.
        maximum:
          type: integer
          format: int
          nullable: true
          default: null
          description: The highest value a point can have, or null for no upper bound.
      required:
        - description
        - isPublic
        - isShared
        - minimum
        - maximum
    Login:
      type: string
      pattern: ^\w+$
      minLength: 3
      maxLength: 35
    Points:
      type: integer
      format: int
    UserPoint:
      type: object
      properties:
        pointType:
          $ref: '#/components/schemas/PointType'
        value:
          $ref: '#/components/schemas/Points'
      required:
        - pointType
        - value
    UserPoints:
      type: array
      items:
        $ref: '#/components/schemas/UserPoint'
    UserPointsByLogins:
      type: array
      items:
        type: object
        properties:
          login:
            $ref: '#/components/schemas/Login'
          points:
            $ref: '#/components/schemas/UserPoints'
        required:
          - login
          - points
    PointChange:
      type: object
      properties:
        desiredChangeValue:
          type: integer
          format: int
      required:
        - desiredChangeValue
    PointChangeResult:
      type: object
      properties:
        desiredChangeValue:
          type: integer
          format: int
        actualChangeValue:
          type: integer
          format: int
        finalValue:
          $ref: '#/components/schemas/Points'
      required:
        - desiredChangeValue
        - actualChangeValue
        - finalValue
    PointHistoryEntry:
      type: object
      properties:
        desiredChangeValue:
          type: integer
          format: int
        actualChangeValue:
          type: integer
          format: int
        finalValue:
          $ref: '#/components/schemas/Points'
        sourceLogin:
          $ref: '#/components/schemas/Login'
        changedDate:
          type: string
          format: date-time
      required:
        - desiredChangeValue
        - actualChangeValue
        - finalValue
        - changedDate
    PointHistoryEntries:
      type: array
      items:
        $ref: '#/components/schemas/PointHistoryEntry'
  responses:
    PointTypesResponse:
      description: Success.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PointTypes'
    ErrorResponse:
      description: Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PointTypeResponse:
      description: Success.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PointType'
    UserPointsByLoginsResponse:
      description: Success.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UserPointsByLogins'
    PointsResponse:
      description: Success.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Points'
    PointChangeResultResponse:
      description: Success.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PointChangeResult'
    PointHistoriesResponse:
      description: Success.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PointHistoryEntries'
    UserPointsResponse:
      description: Success.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UserPoints'
  requestBodies:
    PointTypeCreateRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PointTypeCreate'
    PointTypeChangeRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PointTypeChange'
    PointChangeRequest:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PointChange'
  parameters:
    Name:
      name: name
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Name'
    Login:
      name: login
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Login'
