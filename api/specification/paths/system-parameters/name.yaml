post:
  operationId: changeSystemParameter
  tags: [ SystemParameters ]
  parameters:
    - $ref: "../../components/parameters/PartyId.yaml"
    - $ref: "../../components/parameters/Name.yaml"
  requestBody:
    $ref: "../../components/requests/SystemParameterRequest.yaml"
  responses:
    "201":
      description: The party's override of the parameter was created.
    "204":
      description: The party's existing override of the parameter was changed.
    "400":
      $ref: "../../components/responses/ErrorResponse.yaml"
    "401":
      $ref: "../../components/responses/ErrorResponse.yaml"
    "404":
      $ref: "../../components/responses/ErrorResponse.yaml"
    "500":
      $ref: "../../components/responses/ErrorResponse.yaml"
get:
  operationId: getSystemParameter
  tags: [ SystemParameters ]
  parameters:
    - $ref: "../../components/parameters/PartyId.yaml"
    - $ref: "../../components/parameters/Name.yaml"
  responses:
    "200":
      $ref: "../../components/responses/SystemParameterResponse.yaml"
    "400":
      $ref: "../../components/responses/ErrorResponse.yaml"
    "401":
      $ref: "../../components/responses/ErrorResponse.yaml"
    "404":
      $ref: "../../components/responses/ErrorResponse.yaml"
    "500":
      $ref: "../../components/responses/ErrorResponse.yaml"

delete:
  operationId: resetSystemParameter
  tags: [ SystemParameters ]
  parameters:
    - $ref: "../../components/parameters/PartyId.yaml"
    - $ref: "../../components/parameters/Name.yaml"
  responses:
    "204":
      description: Success.
    "401":
      $ref: "../../components/responses/ErrorResponse.yaml"
    "404":
      $ref: "../../components/responses/ErrorResponse.yaml"
    "500":
      $ref: "../../components/responses/ErrorResponse.yaml"
