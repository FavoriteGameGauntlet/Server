openapi: 3.0.4
info:
  title: Favorite Game Gauntlet
  version: 0.1.0
paths:
  /parties/{partyId}/items/catalog:
    get:
      operationId: getItems
      tags:
        - Items
      parameters:
        - $ref: '#/components/parameters/PartyId'
      responses:
        '200':
          $ref: '#/components/responses/ItemsResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
    post:
      operationId: createItem
      tags:
        - Items
      parameters:
        - $ref: '#/components/parameters/PartyId'
      requestBody:
        $ref: '#/components/requestBodies/ItemCreateRequest'
      responses:
        '201':
          $ref: '#/components/responses/ItemResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/ErrorResponse'
        '422':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
  /parties/{partyId}/items/catalog/removed:
    get:
      operationId: getRemovedItems
      tags:
        - Items
      parameters:
        - $ref: '#/components/parameters/PartyId'
      responses:
        '200':
          $ref: '#/components/responses/ItemsResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
  /parties/{partyId}/items/catalog/{id}:
    delete:
      operationId: removeItem
      tags:
        - Items
      parameters:
        - $ref: '#/components/parameters/PartyId'
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Success.
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
  /parties/{partyId}/items/{login}:
    get:
      operationId: getUserItems
      tags:
        - Items
      parameters:
        - $ref: '#/components/parameters/PartyId'
        - $ref: '#/components/parameters/Login'
      responses:
        '200':
          $ref: '#/components/responses/UserItemsResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
  /parties/{partyId}/items/{login}/history:
    get:
      operationId: getUserItemHistory
      tags:
        - Items
      parameters:
        - $ref: '#/components/parameters/PartyId'
        - $ref: '#/components/parameters/Login'
      responses:
        '200':
          $ref: '#/components/responses/ItemHistoriesResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
  /parties/{partyId}/items/{login}/{id}:
    delete:
      operationId: discardUserItem
      tags:
        - Items
      parameters:
        - $ref: '#/components/parameters/PartyId'
        - $ref: '#/components/parameters/Login'
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Success.
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
  /parties/{partyId}/items/{login}/{id}/use:
    post:
      operationId: useUserItem
      tags:
        - Items
      parameters:
        - $ref: '#/components/parameters/PartyId'
        - $ref: '#/components/parameters/Login'
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Success.
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
components:
  parameters:
    PartyId:
      name: partyId
      in: path
      required: true
      schema:
        type: integer
        format: int
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int
    Login:
      name: login
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Login'
  schemas:
    Name:
      type: string
      pattern: ^.+$
      minLength: 1
      maxLength: 70
    NullableName:
      allOf:
        - $ref: '#/components/schemas/Name'
      nullable: true
      default: null
      x-omitempty: true
    NamedChangeEntry:
      type: object
      description: |
        Names one thing a change grants. Exactly one of pointTypeName, itemId, perkName or effectId has to be set. The amount carries the sign it is applied with, so a cost is negative.
      properties:
        pointTypeName:
          $ref: '#/components/schemas/NullableName'
        itemId:
          type: integer
          format: int
          nullable: true
          default: null
          x-omitempty: true
        perkName:
          $ref: '#/components/schemas/NullableName'
        effectId:
          type: integer
          format: int
          nullable: true
          default: null
          x-omitempty: true
        amount:
          type: integer
          format: int
      required:
        - amount
    NamedChangeEntries:
      type: array
      items:
        $ref: '#/components/schemas/NamedChangeEntry'
    Item:
      type: object
      properties:
        id:
          type: integer
          format: int
        name:
          $ref: '#/components/schemas/Name'
        description:
          type: string
        useCount:
          type: integer
          format: int
        entries:
          $ref: '#/components/schemas/NamedChangeEntries'
      required:
        - id
        - name
        - description
        - useCount
        - entries
    Items:
      type: array
      items:
        $ref: '#/components/schemas/Item'
    Error:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
      required:
        - code
        - message
    ItemCreate:
      type: object
      properties:
        name:
          $ref: '#/components/schemas/Name'
        description:
          type: string
        useCount:
          type: integer
          format: int
        entries:
          $ref: '#/components/schemas/NamedChangeEntries'
      required:
        - name
        - description
        - useCount
        - entries
    Login:
      type: string
      pattern: ^\w+$
      minLength: 3
      maxLength: 35
    UserItem:
      type: object
      properties:
        id:
          type: integer
          format: int
          description: Identifies this copy of the item. A user can hold several copies of the same item.
        itemId:
          type: integer
          format: int
          description: Identifies the item in the catalogue.
        name:
          $ref: '#/components/schemas/Name'
        description:
          type: string
        usesLeft:
          type: integer
          format: int
        receivedDate:
          type: string
          format: date-time
        entries:
          $ref: '#/components/schemas/NamedChangeEntries'
      required:
        - id
        - itemId
        - name
        - description
        - usesLeft
        - receivedDate
        - entries
    UserItems:
      type: array
      items:
        $ref: '#/components/schemas/UserItem'
    ItemHistoryEntry:
      type: object
      properties:
        itemId:
          type: integer
          format: int
          description: Identifies the item in the catalogue.
        userItemId:
          type: integer
          format: int
          description: Identifies the copy of the item the entry is about. The copy may be gone by now.
        name:
          $ref: '#/components/schemas/Name'
        action:
          type: string
        actorLogin:
          $ref: '#/components/schemas/Login'
        useCount:
          type: integer
          format: int
        usesLeft:
          type: integer
          format: int
          nullable: true
          x-omitempty: true
        createdDate:
          type: string
          format: date-time
      required:
        - itemId
        - userItemId
        - name
        - action
        - actorLogin
        - useCount
        - createdDate
    ItemHistoryEntries:
      type: array
      items:
        $ref: '#/components/schemas/ItemHistoryEntry'
  responses:
    ItemsResponse:
      description: Success.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Items'
    ErrorResponse:
      description: Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ItemResponse:
      description: Success.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Item'
    UserItemsResponse:
      description: Success.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UserItems'
    ItemHistoriesResponse:
      description: Success.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ItemHistoryEntries'
  requestBodies:
    ItemCreateRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ItemCreate'
