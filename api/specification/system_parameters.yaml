openapi: 3.0.4
info:
  title: Favorite Game Gauntlet
  version: 0.3.0
paths:
  /parties/{partyId}/system-parameters:
    get:
      operationId: getSystemParameters
      tags:
        - SystemParameters
      parameters:
        - $ref: '#/components/parameters/PartyId'
      responses:
        '200':
          $ref: '#/components/responses/SystemParametersResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
  /parties/{partyId}/system-parameters/{name}:
    post:
      operationId: changeSystemParameter
      tags:
        - SystemParameters
      parameters:
        - $ref: '#/components/parameters/PartyId'
        - $ref: '#/components/parameters/Name'
      requestBody:
        $ref: '#/components/requestBodies/SystemParameterRequest'
      responses:
        '201':
          description: The party's override of the parameter was created.
        '204':
          description: The party's existing override of the parameter was changed.
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
    get:
      operationId: getSystemParameter
      tags:
        - SystemParameters
      parameters:
        - $ref: '#/components/parameters/PartyId'
        - $ref: '#/components/parameters/Name'
      responses:
        '200':
          $ref: '#/components/responses/SystemParameterResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
    delete:
      operationId: resetSystemParameter
      tags:
        - SystemParameters
      parameters:
        - $ref: '#/components/parameters/PartyId'
        - $ref: '#/components/parameters/Name'
      responses:
        '204':
          description: Success.
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
components:
  parameters:
    PartyId:
      name: partyId
      in: path
      required: true
      schema:
        type: integer
        format: int
    Name:
      name: name
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Name'
  schemas:
    Name:
      type: string
      pattern: ^.+$
      minLength: 1
      maxLength: 70
    SystemParameter:
      type: object
      properties:
        name:
          $ref: '#/components/schemas/Name'
        value:
          type: string
        isDefault:
          type: boolean
          description: True if the party has no override of the parameter, so the value is the default one.
      required:
        - name
        - value
        - isDefault
    SystemParameters:
      type: array
      items:
        $ref: '#/components/schemas/SystemParameter'
    Error:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
      required:
        - code
        - message
    SystemParameterChange:
      type: object
      properties:
        value:
          type: string
      required:
        - value
  responses:
    SystemParametersResponse:
      description: Success.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SystemParameters'
    ErrorResponse:
      description: Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    SystemParameterResponse:
      description: Success.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SystemParameter'
  requestBodies:
    SystemParameterRequest:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SystemParameterChange'
